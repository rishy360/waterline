<style>
/* Layout idea: quiet grouped cards on a soft grey ground, one clear number per card, detail tucked behind "Tell me more". */
:root{
  --bg:#f5f5f7; --card:#ffffff; --fill:#f2f2f7; --ink:#1d1d1f; --ink-2:#6e6e73; --line:#e5e5ea;
  --accent:#0071e3; --accent-soft:#e9f2fd;
  --good:#1f7a36; --good-soft:#e7f4ea; --warn:#a05a00; --warn-soft:#fcf1e1; --crit:#c2362d; --crit-soft:#fcebe9;
  --c-housing:#2a78d6; --c-debt:#eb6834; --c-living:#1baf7a; --c-bills:#eda100; --c-transport:#e87ba4; --c-savings:#008300; --c-fun:#6250d6; --c-other:#8e8e93; --c-fees:#e34948;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#1c1c1e; --card:#2c2c2e; --fill:#3a3a3c; --ink:#f2f2f7; --ink-2:#aeaeb2; --line:#3f3f42;
    --accent:#4aa3ff; --accent-soft:#1f3550;
    --good:#5fce85; --good-soft:#1f3a29; --warn:#e9ad4c; --warn-soft:#3d3018; --crit:#f47f77; --crit-soft:#452321;
    --c-housing:#3987e5; --c-debt:#d95926; --c-living:#199e70; --c-bills:#c98500; --c-transport:#d55181; --c-savings:#008300; --c-fun:#9085e9; --c-other:#8e8e93; --c-fees:#e66767;
    --shadow:none;
  }
}
*{box-sizing:border-box}

.note{font-size:.88rem;background:var(--fill);border-radius:12px;padding:10px 12px;color:var(--ink-2)}

.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

@media (prefers-reduced-motion:no-preference){.bar-fill,.progress i{transition:width .35s ease}}

<script id="logic">
/* ---------- Pure logic: dates, projection, CSV import, leak analysis ---------- */
(function(G){
"use strict";
const TYPES={
  chequing:{label:"Chequing",side:"own",cash:true},
  savings:{label:"Savings",side:"own",cash:true},
  invest:{label:"Investments",side:"own"},
  property:{label:"Property",side:"own"},
  other:{label:"Other asset",side:"own"},
  card:{label:"Credit card",side:"owe",rate:true,limit:true},
  loc:{label:"Line of credit",side:"owe",rate:true,limit:true},
  mortgage:{label:"Mortgage",side:"owe",rate:true},
  loan:{label:"Loan",side:"owe",rate:true}
};
const FREQ={once:"One time",weekly:"Every week",biweekly:"Every 2 weeks",semimonthly:"Twice a month",monthly:"Every month",quarterly:"Every 3 months",yearly:"Every year"};
const PER_MONTH={once:0,weekly:52/12,biweekly:26/12,semimonthly:2,monthly:1,quarterly:1/3,yearly:1/12};
const DAY=86400000;
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>iso(new Date(toD(s).getTime()+n*DAY));
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/DAY);
function ymd(y,m0,d){const dim=new Date(Date.UTC(y,m0+1,0)).getUTCDate();return iso(new Date(Date.UTC(y,m0,Math.min(d,dim))));}
function addMonths(s,n){const [y,m,d]=s.split("-").map(Number);const t=y*12+(m-1)+n;return ymd(Math.floor(t/12),((t%12)+12)%12,d);}

function occurrences(item,from,to){
  const out=[],start=item.date;if(!start||!FREQ[item.freq])return out;
  const f=item.freq;
  if(f==="once"){if(start>=from&&start<=to)out.push(start);return out;}
  if(f==="weekly"||f==="biweekly"){
    const step=f==="weekly"?7:14;let d=start;
    if(d<from){const k=Math.ceil(diffDays(d,from)/step);d=addDays(d,k*step);}
    while(d<=to){out.push(d);d=addDays(d,step);}
    return out;
  }
  if(f==="semimonthly"){
    const d1=Number(start.slice(8)),d2=d1<=15?d1+15:d1-15,lo=start>from?start:from;
    let [y,m]=lo.split("-").map(Number);m--;
    for(let i=0;i<200;i++){
      const a=[ymd(y,m,Math.min(d1,d2)),ymd(y,m,Math.max(d1,d2))];
      if(a[0]>to)break;
      for(const d of a)if(d>=lo&&d<=to&&out[out.length-1]!==d)out.push(d);
      m++;if(m>11){m=0;y++;}
    }
    return out;
  }
  const step=f==="monthly"?1:f==="quarterly"?3:12;
  let n=0;
  if(start<from){const [y1,m1]=start.split("-").map(Number),[y2,m2]=from.split("-").map(Number);n=Math.max(0,Math.floor(((y2*12+m2)-(y1*12+m1))/step)-1);}
  for(let i=0;i<2000;i++,n++){const d=addMonths(start,n*step);if(d>to)break;if(d>=from)out.push(d);}
  return out;
}

function totals(plan){
  const t={own:0,owe:0,cash:0,payFrom:0,invest:0,cardBal:0,cardLimit:0,interest:0,byType:{},income:0,bills:0,topRate:null,payNames:[]};
  for(const a of plan.accounts){
    const T=TYPES[a.type];if(!T)continue;const b=Number(a.bal)||0;
    t.byType[a.type]=(t.byType[a.type]||0)+b;
    if(T.side==="own"){t.own+=b;if(T.cash){t.cash+=b;if(a.payFrom){t.payFrom+=b;t.payNames.push(a.name);}}if(a.type==="invest")t.invest+=b;}
    else{
      t.owe+=b;const r=Number(a.rate)||0;t.interest+=b*r/100/12;
      if((a.type==="card"||a.type==="loc")&&Number(a.limit)>0){t.cardBal+=b;t.cardLimit+=Number(a.limit);}
      if(b>0&&r>0&&(!t.topRate||r>t.topRate.rate))t.topRate={name:a.name,rate:r,bal:b,monthly:b*r/100/12};
    }
  }
  for(const i of plan.incomes)t.income+=(Number(i.amt)||0)*(PER_MONTH[i.freq]||0);
  for(const b of plan.bills)t.bills+=(Number(b.amt)||0)*(PER_MONTH[b.freq]||0);
  t.net=t.own-t.owe;t.surplus=t.income-t.bills;
  return t;
}

function project(plan,today,days){
  const end=addDays(today,days),ev=[];
  for(const i of plan.incomes)for(const d of occurrences(i,today,end))ev.push({date:d,name:i.name,amt:Number(i.amt)||0,kind:"in"});
  for(const b of plan.bills)for(const d of occurrences(b,today,end))ev.push({date:d,name:b.name,amt:-(Number(b.amt)||0),kind:"out"});
  ev.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.kind===b.kind?0:a.kind==="in"?-1:1));
  const start=totals(plan).payFrom;let bal=start;
  for(const e of ev){bal+=e.amt;e.bal=bal;}
  const daily=[];let k=0;bal=start;let low={bal:start,date:today};
  for(let i=0;i<=days;i++){
    const d=addDays(today,i);
    while(k<ev.length&&ev[k].date===d){bal=ev[k].bal;k++;}
    daily.push({date:d,bal});
    if(bal<low.bal)low={bal,date:d};
  }
  return {start,events:ev,daily,low,end:bal};
}

/* ---- CSV ---- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const head=text.split(/\r?\n/).slice(0,8).join("\n");
  const cnt=c=>head.split(c).length-1;
  const delim=cnt("\t")>cnt(",")&&cnt("\t")>cnt(";")?"\t":cnt(";")>cnt(",")?";":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];

 look:["how to read a pay stub","marginal vs average tax rate"]},
{id:"liquidity",topic:"Basics",title:"Liquidity: how fast can it become cash?",
 body:["Liquid money can be spent today without losing value: chequing and savings. A home is valuable but illiquid, because turning it into cash takes months and costs fees.","Being wealthy on paper and short of cash at the same time is common. That is why an emergency fund is kept liquid even though it earns less."],
 ex:"$50,000 of home equity cannot pay a $900 car repair this week. $900 in savings can.",
 yours:(t,m)=>t.own?`${m(t.cash)} of the ${m(t.own)} you own is in cash accounts.`:null,
 quiz:{q:"Which is the most liquid?",opts:["A savings account","A house","A retirement account with withdrawal penalties"],a:0,why:"Savings can be moved and spent almost immediately with no loss."},
 look:["liquid vs illiquid assets","house rich cash poor"]},
{id:"pay-yourself-first",topic:"Saving",title:"Pay yourself first",
 body:["Most people save whatever is left at the end of the month, and often nothing is. Paying yourself first flips the order: a set amount moves to savings on payday, and you spend what remains.","Automating the transfer matters more than the size of it. A small amount that happens every payday beats a large amount that depends on willpower."],
 ex:"$100 moved every two weeks is $2,600 a year without a single decision after the first one.",
 widget:["sinking",{amt:2600,label:"Yearly savings target"}],
 quiz:{q:"What makes pay-yourself-first work?",opts:["Saving a large amount","Saving before you spend, automatically","Checking your balance daily"],a:1,why:"The order and the automation do the work. The amount can start small and grow."},
 look:["automatic savings transfer","reverse budgeting"]},
{id:"emergency-fund",topic:"Saving",title:"The emergency fund",
 body:["An emergency fund is cash set aside for the things that are certain to happen at uncertain times: a repair, a gap between jobs, a vet bill. Its job is to keep a surprise from becoming debt.","A common target is three to six months of essential costs. Getting to one month first removes most of the day-to-day stress."],
 ex:"Essentials of $4,000 a month means a starter goal of $4,000 and a fuller goal of $12,000 to $24,000.",
 yours:(t,m)=>t.bills>0?`Your cash covers about ${(t.cash/t.bills).toFixed(1)} months of your planned bills.`:null,
 quiz:{q:"Where does an emergency fund belong?",opts:["In stocks, for growth","Somewhere safe and quick to reach","Locked in a five-year deposit"],a:1,why:"It has to be there, at full value, on the day you need it."},
 look:["emergency fund how much","high interest savings account"]},
{id:"sinking-funds",topic:"Saving",title:"Sinking funds for bills you can see coming",
 body:["Some costs are predictable but irregular: insurance renewals, property tax, holidays, car maintenance. They feel like emergencies only because they arrive in one lump.","A sinking fund spreads them out. Divide the yearly cost by your number of paydays and set that aside each time."],
 ex:"$1,800 of car insurance once a year is $150 a month, or about $69 per biweekly payday.",
 widget:["sinking",{amt:1800,label:"Yearly cost"}],
 quiz:{q:"A $1,200 annual bill needs how much set aside each month?",opts:["$50","$100","$120"],a:1,why:"$1,200 divided by 12 months is $100."},
 look:["sinking funds examples","irregular expenses budget"]},
{id:"savings-rate",topic:"Saving",title:"Savings rate: the number you control",
 body:["Your savings rate is the share of take-home pay you keep. Investment returns are out of your hands, but this number is not, and early on it matters far more than returns do.","Raising it by even a few points compounds, because every dollar saved is also a dollar you have learned to live without."],
 ex:"Keeping $600 of a $6,000 monthly income is a 10% savings rate.",
 yours:(t,m)=>t.income>0?`Right now your plan leaves ${m(t.surplus)} of ${m(t.income)}, which is ${Math.round(t.surplus/t.income*100)}%.`:null,
 quiz:{q:"Income $5,000, saving $750. What is the savings rate?",opts:["7.5%","15%","20%"],a:1,why:"750 divided by 5,000 is 0.15, or 15%."},
 look:["savings rate calculator","how much should I save"]},
{id:"budget-503020",topic:"Cash flow",title:"The 50/30/20 guide",
 body:["A popular starting point splits take-home pay three ways: about 50% for needs, 30% for wants and 20% for saving and extra debt repayment.","It is a yardstick, not a law. In expensive cities needs often run higher. Its real use is showing which of the three buckets is squeezing the others."],
 ex:"On $6,000 a month: $3,000 needs, $1,800 wants, $1,200 saving.",
 yours:(t,m)=>t.income>0?`On your income of ${m(t.income)} that would be ${m(t.income*.5)}, ${m(t.income*.3)} and ${m(t.income*.2)}. The Flow tab shows your actual split.`:null,
 quiz:{q:"In 50/30/20, what is the 20 for?",opts:["Housing","Fun","Saving and extra debt repayment"],a:2,why:"The 20% is the part that builds your future: savings, investing and paying debt down faster."},
 look:["50 30 20 budget","zero based budget"]},
{id:"fixed-variable",topic:"Cash flow",title:"Fixed and variable costs",
 body:["Fixed costs are the same every month: mortgage, insurance, loan payments. Variable costs move with your choices: groceries, fuel, eating out.","Fixed costs are hard to change quickly but each change is permanent. Variable costs are easy to trim but drift back. The biggest lasting wins usually come from renegotiating one fixed cost."],
 ex:"Cutting a $90 phone plan to $55 saves $420 a year with one phone call and no ongoing effort.",
 quiz:{q:"Which is a fixed cost?",opts:["Groceries","A car loan payment","Restaurant meals"],a:1,why:"The loan payment is the same amount on the same day each month."},
 look:["fixed vs variable expenses","how to negotiate bills"]},
{id:"lifestyle-creep",topic:"Cash flow",title:"Lifestyle creep",
 body:["When income rises, spending tends to rise to meet it, one reasonable upgrade at a time. A year later the raise has vanished and nothing feels different.","The counter is to decide in advance: when a raise arrives, send a fixed share of it to savings before it reaches your everyday account."],
 ex:"A $300 a month raise with half saved still gives you $150 more to enjoy, and adds $1,800 a year to savings.",
 quiz:{q:"What is the simplest defence against lifestyle creep?",opts:["Refusing raises","Saving a set share of each raise automatically","Tracking every coffee"],a:1,why:"Deciding once, ahead of time, beats resisting every small upgrade."},
 look:["lifestyle inflation","hedonic adaptation"]},
{id:"subscriptions",topic:"Cash flow",title:"The subscription audit",
 body:["Small recurring charges are easy to sign up for and easy to forget. Each one is minor, and together they can match a utility bill.","Twice a year, list every repeating charge and ask one question of each: would I sign up for this again today at this price?"],
 ex:"Six services averaging $14 a month is about $1,000 a year.",
 yours:()=>"The statement check under Flow builds this list for you from a bank or card statement.",
 quiz:{q:"A $12 a month subscription costs how much over five years?",opts:["$144","$360","$720"],a:2,why:"$12 times 12 months times 5 years is $720."},
 look:["subscription audit","cancel unused subscriptions"]},
{id:"apr",topic:"Debt",title:"How credit card interest works",
 body:["A card's annual rate (APR) is charged on what you carry past the due date. Pay the full statement balance and most cards charge no interest on purchases at all. That window is called the grace period.","Carry any balance and interest is worked out daily on the whole amount, usually including new purchases. That is why a card is cheap as a payment tool and expensive as a loan."],
 ex:"$3,000 carried at 20% costs about $50 a month in interest before you have paid off a single dollar.",
 yours:(t,m)=>t.topRate?`Your highest rate is ${t.topRate.rate}% on ${t.topRate.name}, costing roughly ${m(t.topRate.monthly)} a month.`:null,
 widget:["payoff",{bal:3000,apr:20,pay:150}],
 quiz:{q:"How do you avoid interest on card purchases?",opts:["Pay the minimum on time","Pay the full statement balance by the due date","Keep the balance under the limit"],a:1,why:"Paying the full statement balance keeps the grace period, so purchases cost nothing extra."},
 look:["credit card grace period","how is credit card interest calculated"]},
{id:"minimum-payment",topic:"Debt",title:"The minimum payment trap",
 body:["The minimum payment is set to keep the account in good standing, not to clear the debt. Most of it goes to interest, so the balance barely moves.","Adding even a modest fixed amount on top changes the picture sharply, because every extra dollar goes straight at the balance."],
 ex:"$3,000 at 20% paid at $75 a month takes about five and a half years and close to $2,000 in interest. At $150 a month it takes under two years.",
 widget:["payoff",{bal:3000,apr:20,pay:75}],
 quiz:{q:"Why does paying only the minimum take so long?",opts:["Most of the payment covers interest","Banks delay processing","The balance is frozen"],a:0,why:"After interest is covered, very little is left to reduce what you owe."},
 look:["minimum payment calculator","credit card payoff"]},
{id:"avalanche-snowball",topic:"Debt",title:"Avalanche and snowball",
 body:["Two well-known ways to clear several debts. Avalanche: pay minimums on everything, then put every extra dollar on the highest interest rate. It costs the least overall.","Snowball: put the extra on the smallest balance first. It costs a little more, but closing an account quickly keeps many people going. The best method is the one you will stick with."],
 ex:"Card at 20%, line of credit at 8%, car loan at 7%. Avalanche order is card, line, car.",
 yours:(t,m)=>t.topRate?`By avalanche, your first target would be ${t.topRate.name} at ${t.topRate.rate}%.`:null,
 quiz:{q:"Which method pays the least interest overall?",opts:["Snowball","Avalanche","They are identical"],a:1,why:"Attacking the highest rate first removes the most expensive debt soonest."},
 look:["debt avalanche vs snowball","debt payoff planner"]},
{id:"utilization",topic:"Debt",title:"Credit utilization",
 body:["Utilization is the share of your available revolving credit that is in use. Credit scoring models read high utilization as a sign of strain, even if every payment is on time.","Under about 30% is the figure most often quoted, and lower is better. Paying down a balance improves it quickly, since it is measured fresh each month."],
 ex:"$2,000 owed on a $5,000 limit is 40%. Paying it to $1,400 brings it to 28%.",
 yours:(t,m)=>t.cardLimit>0?`Yours is ${Math.round(t.cardBal/t.cardLimit*100)}%: ${m(t.cardBal)} of ${m(t.cardLimit)}.`:null,
 quiz:{q:"$1,500 owed across cards with $10,000 of total limit. Utilization is:",opts:["1.5%","15%","30%"],a:1,why:"1,500 divided by 10,000 is 15%."},
 look:["credit utilization ratio","what affects credit score"]},
{id:"amortization",topic:"Debt",title:"Why early mortgage payments are mostly interest",
 body:["A mortgage payment stays level, but its makeup changes. Interest is charged on what you still owe, so early on, when the balance is largest, most of each payment is interest.","This is why extra payments in the early years are so powerful: they cut the balance that every future interest charge is based on."],
 ex:"On $400,000 at 5% over 25 years, the payment is about $2,340. In month one, roughly $1,670 of that is interest and $670 reduces the loan.",
 widget:["mortgage",{bal:400000,rate:5,yrs:25,extra:200}],
 quiz:{q:"When does an extra mortgage payment save the most interest?",opts:["Early in the mortgage","In the final years","Timing makes no difference"],a:0,why:"An early extra payment removes balance that would otherwise have charged interest for decades."},
 look:["amortization schedule","mortgage prepayment privileges"]},
{id:"debt-return",topic:"Debt",title:"Paying off debt is a guaranteed return",
 body:["Every dollar that clears a 20% card saves you 20% a year in interest, with no risk and no tax on the gain. Very few investments can promise that.","A useful way to compare: line up each debt's rate against what you could reasonably expect to earn elsewhere. Debts above that line usually come first."],
 ex:"$1,000 off a 20% card saves about $200 a year. $1,000 in a 4% savings account earns about $40.",
 quiz:{q:"Which is usually the better use of a spare $1,000?",opts:["Savings at 4% while carrying a 20% card","Paying down the 20% card"],a:1,why:"Saving 20% beats earning 4%. Keep a small emergency cushion first so a surprise does not go back on the card."},
 look:["pay off debt or invest","interest rate arbitrage personal finance"]},
{id:"compound",topic:"Investing",title:"Compound growth",
 body:["Compounding means earning returns on your earlier returns as well as on what you put in. Growth is slow at first and then speeds up, which is why time matters more than timing.","The same force works against you on debt, where unpaid interest gets charged interest."],
 ex:"$200 a month at 6% for 30 years grows to about $200,000. Only $72,000 of that is money you put in.",
 widget:["compound",{start:0,add:200,rate:6,yrs:30}],
 quiz:{q:"What has the biggest effect on compound growth?",opts:["Picking the perfect day to start","The number of years it has to run","Checking it often"],a:1,why:"Each extra year lets the whole pile grow again, including all the growth so far."},
 look:["compound interest explained","compound interest calculator"]},
{id:"rule-72",topic:"Investing",title:"The rule of 72",
 body:["A quick way to estimate how long money takes to double: divide 72 by the yearly growth rate. It works well for rates between about 4% and 12%.","It works for costs too. Divide 72 by a debt's rate to see how fast it would double if left alone, or by inflation to see how fast prices double."],
 ex:"At 6%, money doubles in about 12 years. At 3% inflation, prices double in about 24.",
 widget:["rule72",{rate:6}],
 quiz:{q:"At 8% a year, money doubles in roughly:",opts:["6 years","9 years","12 years"],a:1,why:"72 divided by 8 is 9."},
 look:["rule of 72","doubling time"]},
{id:"diversification",topic:"Investing",title:"Diversification",
 body:["Spreading money across many companies, industries and countries means no single failure can sink you. The bad news at one firm is offset by ordinary results at hundreds of others.","It does not remove the risk of markets falling as a whole. It removes the risk you were never being paid to take: betting everything on one name."],
 ex:"One stock can go to zero. A fund holding 3,000 companies would need all of them to fail.",
 quiz:{q:"What does diversification protect against?",opts:["All losses","A single company or sector collapsing","Inflation"],a:1,why:"It handles company-specific risk. Whole-market drops still affect a diversified portfolio."},
 look:["diversification investing","asset allocation basics"]},
{id:"index-fees",topic:"Investing",title:"Index funds and the cost of fees",
 body:["An index fund simply holds every company in a market index rather than paying managers to pick winners. Because it is cheap to run, its yearly fee can be a fraction of a percent.","Fees come out every year whether markets rise or fall, and they compound just like returns. A difference that looks tiny becomes very large over decades."],
 ex:"$50,000 for 25 years at 6% before fees: a 2% fee leaves about $133,000, a 0.2% fee about $205,000.",
 widget:["fees",{amt:50000,yrs:25,ret:6,feeA:2,feeB:.2}],
 quiz:{q:"Why do small fee differences matter so much?",opts:["They are charged once at the start","They compound every year","They only apply in bad years"],a:1,why:"A yearly fee reduces the base that all future growth builds on."},
 look:["index fund vs mutual fund","management expense ratio"]},
{id:"risk-horizon",topic:"Investing",title:"Risk and time horizon",
 body:["Investments that can grow more also swing more in the short run. The question is not how much risk you can stomach in the abstract, but when you need the money.","Money needed within a few years belongs somewhere stable. Money for decades away has time to ride out bad stretches."],
 ex:"A down payment needed in 18 months sits in savings. Retirement money 25 years out can be invested for growth.",
 quiz:{q:"You need $20,000 for a purchase next year. Where does it most sensibly sit?",opts:["Somewhere stable, like savings","Entirely in stocks","In a single promising company"],a:0,why:"With a short horizon there is no time to recover from a market drop."},
 look:["investment time horizon","risk tolerance vs risk capacity"]},
{id:"dca",topic:"Investing",title:"Investing a little at a time",
 body:["Putting in a fixed amount on a regular schedule is called dollar-cost averaging. When prices are low your amount buys more, and when they are high it buys less.","It does not guarantee a gain. Its real strength is that it removes the question of when to invest, which is the question that stops most people from starting."],
 ex:"$250 on every payday goes in whether the news is good or bad.",
 quiz:{q:"The main benefit of investing a fixed amount regularly is:",opts:["Guaranteed profit","A steady habit without trying to time the market","Avoiding all fees"],a:1,why:"It builds consistency and takes the timing decision away."},
 look:["dollar cost averaging","lump sum vs dollar cost averaging"]},
{id:"tax-shelter",topic:"Investing",title:"Tax-sheltered accounts",
 body:["Many countries offer accounts where investment growth is taxed lightly or not at all. They are wrappers: the same investments can sit inside, but more of the growth stays yours.","Examples include the TFSA, RRSP and FHSA in Canada, the 401(k), IRA and Roth IRA in the United States, and ISAs and pensions in the UK. Each has its own limits and withdrawal rules, so check the official source for yours."],
 ex:"An employer that matches part of your pension contribution is giving you an instant return before any investing happens.",
 quiz:{q:"A tax-sheltered account is best described as:",opts:["A type of investment","A container that changes how investments inside are taxed","A guaranteed savings rate"],a:1,why:"The account is the wrapper. What you hold inside it is a separate choice."},
 look:["registered accounts your country","employer pension matching"]},
{id:"inflation",topic:"Big picture",title:"Inflation",
 body:["Inflation is the general rise in prices over time. The dollars stay the same but each one buys a little less each year.","Money sitting idle loses buying power quietly. This is the main reason long-term savings are invested rather than left in cash."],
 ex:"At 3% inflation, $100 buys in 20 years what about $55 buys today.",
 widget:["inflation",{amt:100,rate:3,yrs:20}],
 quiz:{q:"Your savings earn 2% while prices rise 3%. Your buying power:",opts:["Grows 2%","Shrinks about 1%","Stays the same"],a:1,why:"The gap between what you earn and inflation is your real return, here about minus 1%."},
 look:["inflation purchasing power","real vs nominal return"]},
{id:"opportunity-cost",topic:"Big picture",title:"Opportunity cost",
 body:["Every dollar can only be used once. The true cost of anything is the next best thing that dollar could have done.","This is not an argument against spending. It is a way to check that a purchase is worth more to you than the alternative."],
 ex:"A $600 a month car payment versus a $350 one is $3,000 a year that could clear a card or fill an emergency fund.",
 quiz:{q:"The opportunity cost of a $2,000 holiday is:",opts:["$2,000","Whatever else that $2,000 would have done for you","Nothing, if paid in cash"],a:1,why:"The cost is the best alternative you gave up."},
 look:["opportunity cost examples","time value of money"]}
];
/* ---------- Canadian tax and account lessons. Figures checked November 2026. ---------- */
(function(){
const T="Canada: tax and accounts",NOTE=" Limits change, so confirm the current figure on canada.ca.";
const CA=[
{id:"ca-tfsa",topic:T,title:"TFSA: tax-free growth you can take back out",
 body:["A Tax-Free Savings Account is a wrapper, not a savings product. You put in money that has already been taxed, and everything it earns inside, whether interest, dividends or gains, is never taxed, including when you take it out.","Room builds every year from age 18 whether or not you use it. Withdrawals are added back to your room on January 1 of the following year, which makes the TFSA flexible enough for both long-term investing and nearer goals."],
 ex:"The 2026 limit is $7,000. Someone eligible every year since 2009 who has never contributed has $109,000 of room."+NOTE,
 quiz:{q:"You withdraw $5,000 from your TFSA in June. When can you put it back without using other room?",opts:["Right away","January 1 of next year","Never"],a:1,why:"Withdrawn amounts are added back to your room at the start of the following calendar year. Re-contributing sooner can count as an over-contribution if you have no other room."},
 look:["TFSA contribution room CRA","TFSA vs savings account"]},
{id:"ca-rrsp",topic:T,title:"RRSP: a tax deduction now, tax later",
 body:["Money you put into a Registered Retirement Savings Plan is deducted from your income, so you get back tax at your marginal rate. It then grows untaxed until you withdraw, when it is taxed as ordinary income.","The idea is to deduct in high-earning years and withdraw in lower-income years such as retirement. New room each year is 18% of the previous year's earned income up to a yearly cap, less any pension adjustment, and unused room carries forward."],
 ex:"The cap for 2026 is $33,810. Contributions made in the first 60 days of a year can be deducted on the previous year's return; for the 2026 tax year that deadline is March 1, 2027."+NOTE,
 quiz:{q:"When is an RRSP deduction worth the most?",opts:["In a low-income year","In a high-income year","It is always worth the same"],a:1,why:"The deduction saves tax at your marginal rate, so it is worth more when your income, and therefore your rate, is higher. You can contribute now and claim the deduction in a later year."},
 look:["RRSP deduction limit","Notice of Assessment RRSP room"]},
{id:"ca-fhsa",topic:T,title:"FHSA: the first-home account",
 body:["The First Home Savings Account combines the best of the other two: contributions are deductible like an RRSP, and a withdrawal to buy a qualifying first home is tax-free like a TFSA.","Room only starts once you open the account, and at most one year of unused room carries forward. The account has a 15-year life. If it is not used for a home, the money can generally move to an RRSP without using RRSP room."],
 ex:"$8,000 of room a year, $40,000 for life, and up to $8,000 of unused room carried into the next year."+NOTE,
 quiz:{q:"When does FHSA contribution room start building?",opts:["At age 18","When you open the account","When you buy a home"],a:1,why:"Unlike the TFSA, room does not accumulate before the account exists."},
 look:["FHSA qualifying withdrawal","FHSA transfer to RRSP"]},
{id:"ca-rrsp-tfsa",topic:T,title:"RRSP or TFSA first?",
 body:["Both shelter growth. The difference is when the tax is paid. The TFSA taxes the money before it goes in and never again. The RRSP gives tax back now and collects it on the way out.","If your tax rate will be lower when you withdraw than it is today, the RRSP comes out ahead. If it will be the same, they tie. If it will be higher, or you may need the money before retirement, the TFSA usually wins."],
 ex:"Deduct at a 43% marginal rate today and withdraw at 30% in retirement, and the RRSP has kept 13 cents of every dollar from tax.",
 quiz:{q:"What mainly decides RRSP versus TFSA?",opts:["Which bank offers it","Your tax rate now compared with when you withdraw","The investments inside"],a:1,why:"The same investments can sit in either account. The outcome differs only through the tax rate at contribution versus withdrawal."},
 look:["RRSP vs TFSA marginal tax rate","RRSP refund reinvest"]},
{id:"ca-marginal",topic:T,title:"Marginal tax rate",
 body:["Canada taxes income in layers called brackets. Each layer has its own rate, and a higher rate applies only to the dollars inside that layer. A raise can never reduce your take-home pay overall.","Your marginal rate is the rate on your next dollar, federal and provincial combined. It is the number that matters for decisions, because it is what a deduction saves you and what extra income costs you."],
 ex:"At a 40% marginal rate, a $1,000 RRSP contribution returns about $400 at tax time, and $1,000 of extra interest income costs about $400.",
 quiz:{q:"A raise moves you into a higher tax bracket. What happens?",opts:["All your income is taxed at the higher rate","Only the income above the threshold is taxed at the higher rate"],a:1,why:"Brackets apply layer by layer. Income below the threshold is taxed exactly as before."},
 look:["Canada tax brackets by province","marginal vs average tax rate Canada"]},
{id:"ca-invest-income",topic:T,title:"Not all investment income is taxed alike",
 body:["Outside registered accounts, the type of income matters. Interest is taxed in full at your marginal rate. Only half of a capital gain is included in income. Dividends from Canadian companies come with a tax credit that lowers the tax on them.","This is why people often hold interest-paying investments inside registered accounts first, and why a gain is only taxed when you sell."],
 ex:"A $10,000 capital gain adds $5,000 to taxable income. $10,000 of interest adds all $10,000."+NOTE,
 quiz:{q:"In a taxable account, which is taxed most heavily per dollar?",opts:["Interest","Capital gains","Eligible Canadian dividends"],a:0,why:"Interest is fully taxable. Capital gains are half included, and Canadian dividends receive a tax credit."},
 look:["capital gains inclusion rate Canada","dividend tax credit","asset location"]},
{id:"ca-room",topic:T,title:"Knowing your contribution room",
 body:["Your RRSP room is printed on your Notice of Assessment each year, and both RRSP and TFSA room are shown in your CRA online account. The TFSA figure there can lag, because institutions report the previous year's activity early in the new year.","Going over your room is costly. Excess TFSA contributions are charged 1% per month until removed, so keep your own running record across every institution you use."],
 ex:"$3,000 over your TFSA room for four months costs $120, and the excess still has to come out.",
 quiz:{q:"Who is responsible for tracking TFSA room across several banks?",opts:["Each bank","The CRA in real time","You"],a:2,why:"Each bank sees only its own account, and CRA's figure is not live. Your own record is the safeguard."},
 look:["CRA My Account TFSA room","TFSA over-contribution penalty"]},
{id:"ca-hbp",topic:T,title:"The Home Buyers' Plan",
 body:["The Home Buyers' Plan lets a first-time buyer take money out of an RRSP for a home without paying tax on the withdrawal. It is a loan from your own retirement savings.","The amount must be repaid to the RRSP over a set schedule of up to 15 years. Any year's missed repayment is added to that year's taxable income. It can be combined with an FHSA withdrawal for the same purchase."],
 ex:"The withdrawal limit is $60,000 per person, so a couple who both qualify could use up to $120,000."+NOTE,
 quiz:{q:"What happens if you skip a required HBP repayment?",opts:["Nothing","That year's amount is added to your taxable income","The whole withdrawal becomes taxable"],a:1,why:"Only the missed instalment for that year is taxed as income."},
 look:["Home Buyers' Plan repayment","HBP and FHSA together"]},
{id:"ca-spousal",topic:T,title:"Spousal RRSP",
 body:["With a spousal RRSP, one partner contributes and takes the deduction, and the other partner owns the account and pays the tax on withdrawals. It uses the contributor's own RRSP room.","The purpose is to even out retirement incomes so that two people each pay tax in lower brackets, rather than one person paying in a high one. Money withdrawn within about three years of a contribution is taxed back to the contributor."],
 ex:"The higher earner deducts at 43% today. In retirement the lower-income spouse withdraws at perhaps 25%.",
 quiz:{q:"Who claims the deduction for a spousal RRSP contribution?",opts:["The spouse who owns the account","The spouse who contributed"],a:1,why:"The contributor deducts it against their own income and uses their own room."},
 look:["spousal RRSP attribution rule","pension income splitting"]},
{id:"ca-property",topic:T,title:"Homes, rentals and tax",
 body:["When you sell the home you live in, the principal residence exemption generally makes the gain tax-free. A family can designate only one property per year. A property you rent out is different: rent minus eligible expenses is added to your income each year, and a gain on sale is a taxable capital gain.","Timing matters too. Profit on a residential property sold after being owned for less than 365 days is generally treated as fully taxable business income rather than a capital gain, with exceptions for certain life events."],
 ex:"Expenses commonly deducted against rent include mortgage interest, property tax, insurance, condo fees and repairs. Property rules are detailed, so speak to an accountant before selling or renting.",
 quiz:{q:"Which sale is generally tax-free?",opts:["A rental condo","The home you have lived in as your principal residence","A property sold after six months"],a:1,why:"The principal residence exemption covers the home you ordinarily live in, for the years it is designated."},
 look:["principal residence exemption","rental income CRA T776","residential property flipping rule"]},
{id:"ca-match",topic:T,title:"Employer matching",
 body:["Many employers add money to a group RRSP, pension or share plan when you contribute. A 50% match means every dollar you put in is immediately worth $1.50, before any investment growth.","It is usually the first place for savings to go, ahead of other investing. Check your plan for the match rate, the cap, and any vesting period before the employer's share is fully yours."],
 ex:"Contribute 4% of an $80,000 salary with a full match and $3,200 becomes $6,400 a year.",
 quiz:{q:"Your employer matches contributions up to 4% of pay and you put in 2%. What are you giving up?",opts:["Nothing","Half of the available match","Your tax deduction"],a:1,why:"The employer would match another 2% of pay that you are not contributing."},
 look:["group RRSP matching","DPSP vesting","pension adjustment"]}
,
{id:"ca-fixed-variable",topic:T,title:"Fixed and variable mortgages",

/* ---- Mortgage ---- */
let mDelta=.5,mExtra=0;
const effM=(a,rate)=>{const r=(rate==null?Number(a.rate)||0:rate)/100;return a.rateType==="variable"?r/12:Math.pow(1+r/2,1/6)-1;};
const nper=(B,i,p)=>p<=B*i+1e-9?Infinity:(i?-Math.log(1-i*B/p)/Math.log(1+i):B/p);
const pmtFor=(B,i,n)=>i?B*i/(1-Math.pow(1+i,-n)):B/n;
const yrs=n=>{if(!isFinite(n))return "never";const t=Math.round(n),y=Math.floor(t/12),m=t-y*12;return (y?y+(y===1?" year":" years"):"")+(y&&m?" ":"")+(m||!y?m+(m===1?" month":" months"):"");};
const mortgages=()=>plan.accounts.filter(a=>a.type==="mortgage"&&a.bal>0);
function mPay(a){
  if(a.pay>0)return a.pay*(L.PER_MONTH[a.payFreq||"monthly"]||1);
  if(mortgages().length===1){const b=plan.bills.find(b=>/mortgage/i.test(b.name));if(b)return (Number(b.amt)||0)*(L.PER_MONTH[b.freq]||1);}
  return 0;
}
function applyPrime(){if(!(plan.prime>0))return;for(const a of plan.accounts)if(a.rateType==="variable"&&L.TYPES[a.type]&&L.TYPES[a.type].rate)a.rate=Math.round((plan.prime+(Number(a.spread)||0))*100)/100;}
const rateLabel=a=>a.rateType==="variable"?`${a.rate}% variable (prime ${plan.prime||"?"}% ${(a.spread||0)<0?"−":"+"} ${Math.abs(a.spread||0).toFixed(2)})`:`${a.rate||0}% fixed`;
function mortgageHomeCard(){
  const ms=mortgages();if(!ms.length)return "";
  const a=ms[0],i=effM(a),p=mPay(a),int=a.bal*i;
  return `<div class="card"><div class="stack"><div class="row"><h2>Your mortgage</h2><a class="btn small" href="#mortgage">Open</a></div><p class="num">${money(a.bal)} at ${esc(rateLabel(a))}. ${p>0?`About ${money(int)} of this month's ${money(p)} in payments is interest and ${money(p-int)} pays down the loan.`:`Interest is running at about ${money(int)} a month.`}</p></div></div>`;
}
function rateScenario(a,f){
  const B=a.bal,i=effM(a),p=mPay(a),n=nper(B,i,p),r2=Math.max(0,(Number(a.rate)||0)+mDelta),i2=effM(a,r2);
  if(!(p>0))return `<p class="muted">Add your regular payment (Edit, under Accounts) to see what a rate change would do.</p>`;
  if(!isFinite(n))return `<p class="note err">At the current rate your payment does not cover the interest, so the balance is not going down. Check the payment and rate you entered.</p>`;
  let d=0,html="";
  if(a.rateType!=="variable"){
    const k=a.renew&&a.renew>TODAY?Math.min(Math.round(L.diffDays(TODAY,a.renew)/30.44),Math.floor(n)-1):0;
    const g=Math.pow(1+i,k),Bk=i?B*g-p*(g-1)/i:B-p*k,p2=pmtFor(Bk,i2,n-k);d=p2-p;
    html=`<p class="num">${k?`Nothing changes until you renew in ${dfmt(a.renew,{day:undefined,year:"numeric"})}, when you should owe about ${money(Bk)}.`:"Your rate is locked until your term ends."} Renewing at <strong>${r2.toFixed(2)}%</strong> would make the payment about <strong>${money(p2)}</strong> a month, which is ${money(Math.abs(d))} ${d>=0?"more":"less"} than now.</p>${a.renew?"":`<p class="small muted">Add your renewal date under Accounts and this uses the balance you will owe on that day.</p>`}`;
  }else if(a.varPay==="fixed"){
    const int2=B*i2;
    if(p<=int2)html=`<p class="num">${pill("crit","Trigger rate")} At <strong>${r2.toFixed(2)}%</strong> the interest would be ${money(int2)} a month, more than your ${money(p)} payment. Lenders call this the trigger rate and normally require a higher payment or a lump sum.</p>`;
    else{const n2=nper(B,i2,p);html=`<p class="num">At <strong>${r2.toFixed(2)}%</strong> your payment stays at ${money(p)}, but the interest part goes from ${money(B*i)} to ${money(int2)} a month. Time left changes from ${yrs(n)} to ${yrs(n2)}.</p>`;}
  }else{
    const p2=pmtFor(B,i2,n);d=p2-p;
    html=`<p class="num">At <strong>${r2.toFixed(2)}%</strong> your payment would be about <strong>${money(p2)}</strong> a month, which is ${money(Math.abs(d))} ${d>=0?"more":"less"} than now.</p>`;
  }
  if(Math.abs(d)>=1&&f&&plan.incomes.length)html+=`<p class="num">${f.left-d<0?pill("warn","Tight"):pill("good","Fits")} Your monthly left over would go from ${money(f.left)} to ${money(f.left-d)}.</p>`;
  return html;

function extraScenario(a){

async function handleFiles(files){

function niceStep(range){const raw=range/3,p=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/p;return (n<1.5?1:n<3.5?2:n<7.5?5:10)*p;}

  return `<div class="widget" data-w="${type}"><span class="eyebrow">Try it with your own numbers</span><div class="ins">${w.f.map(([k,l])=>`<label>${k==="amt"&&d.label?esc(d.label):l}<input type="text" inputmode="decimal" data-k="${k}" id="w-${type}-${k}" value="${d[k]!=null?d[k]:0}"></label>`).join("")}</div><div class="out num">${w.calc(d)}</div></div>`;
}
function renderLearn(t,proj){
  const el=$("#v-learn"),today=todaysLesson(),l=LESSONS.find(x=>x.id===lessonId)||today,done=Object.keys(learn.done).filter(k=>LESSONS.find(x=>x.id===k)).length;
  let wd=l.widget?Object.assign({},l.widget[1]):null;
  if(wd&&l.id==="apr"&&t.topRate&&!sample)wd={bal:Math.round(t.topRate.bal),apr:t.topRate.rate,pay:Math.max(25,Math.round(t.topRate.bal*.05/5)*5)};
  const yours=l.yours?l.yours(t,money,proj):null,topics=[...new Set(LESSONS.map(x=>x.topic))];
  el.innerHTML=`
  <div class="card"><div class="row"><div class="streak"><div><div class="n num">${learn.streak||1}</div><div class="small muted">day streak</div></div><div><div class="n num">${done}<span class="muted" style="font-size:1rem;font-weight:500"> / ${LESSONS.length}</span></div><div class="small muted">lessons learned</div></div></div><button class="btn small" data-act="surprise">Surprise me</button></div>

  <div class="card lesson" id="lesson"><div class="stack"><div class="row"><span class="eyebrow">${l.id===today.id?"Today's lesson":"Lesson"} · ${esc(l.topic)}</span>${learn.done[l.id]?pill("good","Learned"):""}</div>
    <h2 style="font-size:1.35rem">${esc(l.title)}</h2>
    ${l.body.map(p=>`<p>${esc(p)}</p>`).join("")}
    <div class="ex"><span class="eyebrow">In real numbers</span><p>${esc(l.ex)}</p></div>
    ${yours?`<div class="yours"><span class="eyebrow">${sample?"With the example numbers":"With your numbers"}</span><p class="num">${esc(yours)}</p></div>`:""}
    ${wd?widget(l.widget[0],wd):""}
    <div class="quiz" data-a="${l.quiz.a}"><span class="eyebrow">Quick check</span><p><strong>${esc(l.quiz.q)}</strong></p>${l.quiz.opts.map((o,i)=>`<button data-act="quiz" data-i="${i}">${esc(o)}</button>`).join("")}<p class="note" id="quiz-why" hidden>${esc(l.quiz.why)}</p></div>

    <div class="row"><button class="btn ${learn.done[l.id]?"":"primary"}" data-act="learned" data-id="${l.id}">${learn.done[l.id]?"Mark as not learned":"Got it, mark as learned"}</button>${l.id!==today.id?`<button class="btn" data-act="open-today">Back to today's</button>`:""}</div>
  </div></div>
  <div class="card"><div class="stack" style="gap:4px"><h2>All lessons</h2>${topics.map(tp=>`<details class="more" ${tp===l.topic?"open":""}><summary><span>${esc(tp)}</span><span class="muted small num" style="margin-left:auto">${LESSONS.filter(x=>x.topic===tp&&learn.done[x.id]).length} of ${LESSONS.filter(x=>x.topic===tp).length}</span></summary><div class="body"><ul class="list">${LESSONS.filter(x=>x.topic===tp).map(x=>`<li><div class="li-main"><div class="t">${esc(x.title)}</div></div>${learn.done[x.id]?pill("good","Learned"):""}<button class="btn small" data-act="lesson" data-id="${x.id}">${x.id===l.id?"Open":"Read"}</button></li>`).join("")}</ul></div></details>`).join("")}
  <p class="small muted" style="padding-top:8px">These lessons explain general concepts. They are education, not personal financial advice.</p></div></div>`;
}

  <div class="card"><div class="stack"><div class="row"><h2>What you own</h2><button class="btn small" data-act="add-account" data-side="own">Add</button></div>${grp("own").length?`<ul class="list">${grp("own").map(acct).join("")}</ul>`:`<p class="muted">Chequing, savings, investments, property.</p>`}</div></div>

    ${why("Enter the balance owing and the yearly interest rate from your statement. For cards and lines of credit, add the limit too. Update balances about once a month. A minute or two keeps every page here accurate.","What to enter")}</div></div>
  <div class="card"><div class="stack"><div class="row"><h2>Paydays</h2><button class="btn small" data-act="add-income">Add</button></div>${plan.incomes.length?`<ul class="list">${plan.incomes.map(x=>sched(x,"income")).join("")}</ul><p class="small muted num">About ${money(t.income)} a month.</p>`:`<p class="muted">Use take-home pay, the amount that lands in your account.</p>`}</div></div>
  <div class="card"><div class="stack"><div class="row"><h2>Bills and payments</h2><button class="btn small" data-act="add-bill">Add</button></div>${plan.bills.length?`<ul class="list">${plan.bills.map(x=>sched(x,"bill")).join("")}</ul><p class="small muted num">About ${money(t.bills)} a month.</p>`:`<p class="muted">Mortgage, loan and card payments, utilities, insurance. Add a weekly estimate for groceries and everyday spending so the picture is honest.</p>`}</div></div>
  <div class="card"><div class="stack"><h2>Your data stays here</h2>
    <p class="small muted">The app is an empty page at its own web address, and it can load only its own files. Your numbers are kept on this device, in this browser, and are never sent anywhere. Names and balances are all it needs, so leave out account and card numbers.</p><p class="small muted">Each device keeps its own copy. To use the same numbers on your iPhone and your Mac, export a backup on one and import it on the other.</p>
    <p class="small muted">${plan.backup?"Last backup saved "+dfmt(plan.backup,{year:"numeric"})+".":"No backup saved yet."} A backup is a small file you keep wherever you like. It protects you if the browser's storage is cleared, and it is how you move to another device.</p>
    <div class="actions" style="justify-content:flex-start">${sample?"":`<button class="btn" data-act="export">Export backup</button>`}<label class="btn" for="imp">Import backup</label><input type="file" id="imp" accept=".json,application/json" hidden>${sample?"":`<button class="btn danger" data-act="erase">Erase everything</button>`}</div>
    <p class="note" id="data-note" hidden></p>
    <p class="small muted">Version ${VERSION}</p>
  </div></div>
  <div class="card"><div class="row"><div class="li-main"><div class="t">Your mortgage and prime rate</div><div class="s">Where each payment goes, and what a rate change would mean.</div></div><a class="btn" href="#mortgage">Open</a></div></div>
  <div class="card"><div class="row"><div class="li-main"><div class="t">How the numbers are calculated</div><div class="s">The main formulas, with examples, so you can check them yourself.</div></div><a class="btn" href="#formulas">Open</a></div></div>
  <div class="card"><div class="row"><div class="li-main"><div class="t">Getting started guide</div><div class="s">Setup steps, a tour of the tabs and the monthly routine.</div></div><button class="btn" data-act="guide">Open</button></div></div>
  <div class="card"><div class="stack"><h2>Put it on your Home Screen</h2><p class="small muted"><strong>iPhone:</strong> open this page in Safari, tap the Share button, then Add to Home Screen. Open it from the new icon from then on, and enter your numbers there. <strong>Mac:</strong> in Safari choose File, then Add to Dock. After the first visit it opens without an internet connection.</p></div></div>`;
  $("#imp").addEventListener("change",async e=>{
    const file=e.target.files[0];if(!file)return;const note=$("#data-note");
    try{const o=JSON.parse(await file.text());if(!o.plan||!Array.isArray(o.plan.accounts))throw 0;plan=Object.assign(emptyPlan(),o.plan);txs=Array.isArray(o.txs)?o.txs:[];if(o.learn){learn=Object.assign(learn,o.learn);saveLearn();}sample=false;whatIf=null;save();render();}
    catch(err){note.textContent="That file is not a Waterline backup.";note.className="note err";note.hidden=false;}
  });
}
async function exportBackup(){
  plan.backup=TODAY;save();
  const name="waterline-backup-"+TODAY+".json",blob=new Blob([JSON.stringify({app:"waterline",saved:TODAY,plan,txs,learn},null,1)],{type:"application/json"});
  try{const file=new File([blob],name,{type:"application/json"});
    if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});render();return;}
  }catch(e){if(e&&e.name==="AbortError"){render();return;}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  render();
}

/* ---- Dialog forms ---- */
function openForm(kind,id,preset){
  const dlg=$("#dlg");
  const list=kind==="account"?plan.accounts:kind==="income"?plan.incomes:kind==="goal"?plan.goals:plan.bills;
  const cur=id?list.find(x=>x.id===id):null;
  let v=Object.assign(kind==="account"?{name:"",type:preset||"chequing",bal:"",rate:"",limit:"",payFrom:!plan.accounts.some(a=>a.payFrom)}:kind==="goal"?{name:"",target:"",saved:"",date:""}:{name:"",amt:"",freq:kind==="income"?"biweekly":"monthly",date:TODAY,cat:""},cur||{},typeof preset==="object"?preset:{});
  const opt=(o,sel)=>Object.keys(o).map(k=>`<option value="${k}" ${k===sel?"selected":""}>${esc(o[k].label||o[k])}</option>`).join("");
  function build(){
    const T=L.TYPES[v.type]||{};
    dlg.innerHTML=`<form class="f" id="f" novalidate><h2 id="dlg-title">${cur?"Edit ":"Add "}${kind==="account"?"account":kind==="income"?"payday":kind==="goal"?"goal":"bill"}</h2>`+
    (kind==="account"?`
      <label for="f-type">Type<select id="f-type">${opt(L.TYPES,v.type)}</select></label>
      <label for="f-name">Name<input type="text" id="f-name" value="${esc(v.name)}" placeholder="${T.side==="owe"?"e.g. Travel card":"e.g. Main chequing"}" autocomplete="off"></label>
      <label for="f-bal">${T.side==="owe"?"Balance owing":"Current balance"}<input type="text" inputmode="decimal" id="f-bal" value="${esc(v.bal)}" placeholder="0"></label>
      ${T.rate&&v.type!=="card"?`<label for="f-rt">Rate type<select id="f-rt"><option value="fixed" ${v.rateType!=="variable"?"selected":""}>Fixed</option><option value="variable" ${v.rateType==="variable"?"selected":""}>Variable: prime plus or minus</option></select></label>`:""}
      ${T.rate&&(v.type==="card"||v.rateType!=="variable")?`<label for="f-rate">Interest rate, % a year<input type="text" inputmode="decimal" id="f-rate" value="${esc(v.rate||"")}" placeholder="e.g. 4.89"><span class="hint">It is printed on your statement.</span></label>`:""}
      ${T.rate&&v.type!=="card"&&v.rateType==="variable"?`<label for="f-prime">Prime rate today, %<input type="text" inputmode="decimal" id="f-prime" value="${esc(plan.prime||"")}" placeholder="e.g. 4.95"><span class="hint">Your lender's prime. One setting shared by all your variable debts.</span></label><label for="f-spread">Your rate compared with prime<input type="text" inputmode="text" id="f-spread" value="${esc(v.spread==null?"":v.spread)}" placeholder="e.g. -0.50 or 1.25"><span class="hint">Prime minus 0.50 is entered as -0.50.</span></label>`:""}
      ${v.type==="mortgage"?`<label for="f-mpay">Regular payment<input type="text" inputmode="decimal" id="f-mpay" value="${esc(v.pay||"")}" placeholder="0"></label><label for="f-pf">How often you pay<select id="f-pf">${["weekly","biweekly","semimonthly","monthly"].map(k=>`<option value="${k}" ${k===(v.payFreq||"monthly")?"selected":""}>${L.FREQ[k]}</option>`).join("")}</select></label>${v.rateType==="variable"?`<label for="f-vp">When prime changes<select id="f-vp"><option value="moves" ${v.varPay!=="fixed"?"selected":""}>My payment changes</option><option value="fixed" ${v.varPay==="fixed"?"selected":""}>My payment stays the same</option></select><span class="hint">Your mortgage documents or lender can tell you which.</span></label>`:`<label for="f-renew">Renewal date, optional<input type="date" id="f-renew" value="${esc(v.renew||"")}"></label>`}`:""}
      ${T.limit?`<label for="f-limit">Credit limit<input type="text" inputmode="decimal" id="f-limit" value="${esc(v.limit||"")}" placeholder="0"></label>`:""}
      ${v.type==="invest"?`<label for="f-reg">Kind of account<select id="f-reg">${["","TFSA","RRSP","FHSA","RESP","Workplace pension","Non-registered"].map(x=>`<option ${x===(v.reg||"")?"selected":""} value="${x}">${x||"Not set"}</option>`).join("")}</select></label>`:""}
      ${T.cash?`<label class="cb" for="f-pay"><input type="checkbox" id="f-pay" ${v.payFrom?"checked":""}>Bills come out of this account</label>`:""}`
    :kind==="goal"?`
      <label for="f-name">What is it for?<input type="text" id="f-name" value="${esc(v.name)}" placeholder="e.g. Holiday" autocomplete="off"></label>
      <label for="f-target">Target amount<input type="text" inputmode="decimal" id="f-target" value="${esc(v.target)}" placeholder="0"></label>
      <label for="f-saved">Saved so far<input type="text" inputmode="decimal" id="f-saved" value="${esc(v.saved)}" placeholder="0"></label>
      <label for="f-date">Target date, optional<input type="date" id="f-date" value="${esc(v.date||"")}"></label>`
    :`
      <label for="f-name">Name<input type="text" id="f-name" value="${esc(v.name)}" placeholder="${kind==="income"?"e.g. Paycheque":"e.g. Car insurance"}" autocomplete="off"></label>
      <label for="f-amt">${kind==="income"?"Take-home amount":"Amount"}<input type="text" inputmode="decimal" id="f-amt" value="${esc(v.amt)}" placeholder="0"></label>
      <label for="f-freq">How often<select id="f-freq">${opt(L.FREQ,v.freq)}</select></label>
      <label for="f-date">${kind==="income"?"Next payday":"Next due date"}<input type="date" id="f-date" value="${esc(v.date)}"><span class="hint">Later dates are worked out from this one.</span></label>
      ${kind==="bill"?`<label for="f-cat">Category<select id="f-cat"><option value="">Choose for me</option>${opt(CATS,v.cat)}</select></label>`:""}`)+
    `<p class="note err" id="f-err" hidden></p>
     <div class="f-actions"><div>${cur?`<button type="button" class="btn danger" id="f-del">Delete</button>`:""}</div><div class="actions"><button type="button" class="btn" id="f-cancel">Cancel</button><button type="submit" class="btn primary">Save</button></div></div></form>`;
    const g=i=>dlg.querySelector("#"+i);
    if(kind==="account"){const grab=()=>{const m={name:"f-name",bal:"f-bal",rate:"f-rate",limit:"f-limit",spread:"f-spread",pay:"f-mpay",payFreq:"f-pf",renew:"f-renew",varPay:"f-vp",rateType:"f-rt",type:"f-type"};for(const k in m){const e=g(m[k]);if(e)v[k]=e.value;}build();};g("f-type").addEventListener("change",grab);if(g("f-rt"))g("f-rt").addEventListener("change",grab);}
    g("f-cancel").addEventListener("click",()=>dlg.close());
    if(cur){let armed=false;g("f-del").addEventListener("click",()=>{if(!armed){armed=true;g("f-del").textContent="Tap again to delete";return;}list.splice(list.indexOf(cur),1);dlg.close();save();render();});}
    g("f").addEventListener("submit",e=>{
      e.preventDefault();const name=g("f-name").value.trim(),err=g("f-err"),fail=m=>{err.textContent=m;err.hidden=false;};
      if(!name)return fail("Give it a name so you can recognise it.");
      let o;
      if(kind==="account"){const T2=L.TYPES[g("f-type").value];o={name,type:g("f-type").value,bal:Math.abs(num(g("f-bal").value)),updated:TODAY};if(T2.rate&&g("f-rate"))o.rate=num(g("f-rate").value);if(g("f-rt")){o.rateType=g("f-rt").value;if(o.rateType==="variable"){const pr=num(g("f-prime").value);if(!(pr>0)&&!(plan.prime>0)){err.textContent="Enter today's prime rate.";err.hidden=false;return;}if(pr>0&&pr!==plan.prime){plan.prime=pr;plan.primeUpdated=TODAY;}o.spread=num(g("f-spread").value);o.rate=Math.round((plan.prime+o.spread)*100)/100;}}if(o.type==="mortgage"){o.pay=Math.abs(num(g("f-mpay").value));o.payFreq=g("f-pf").value;if(g("f-renew"))o.renew=g("f-renew").value;if(g("f-vp"))o.varPay=g("f-vp").value;}if(T2.limit)o.limit=num(g("f-limit").value);if(T2.cash)o.payFrom=g("f-pay").checked;if(o.type==="invest")o.reg=g("f-reg").value;}
      else if(kind==="goal"){o={name,target:Math.abs(num(g("f-target").value)),saved:Math.abs(num(g("f-saved").value)),date:g("f-date").value};if(!o.target)return fail("Enter a target above zero.");}
      else{o={name,amt:Math.abs(num(g("f-amt").value)),freq:g("f-freq").value,date:g("f-date").value};if(!o.amt)return fail("Enter an amount above zero.");if(!o.date)return fail("Pick a date.");if(kind==="bill")o.cat=g("f-cat").value||guessCat(name);}
      if(cur){for(const k of ["rate","limit","payFrom","reg","rateType","spread","pay","payFreq","renew","varPay"])delete cur[k];Object.assign(cur,o);}else list.push(Object.assign({id:uid()},o));
      if(v._key){plan.seen=plan.seen||{};plan.seen[v._key]=1;}
      if(kind==="account")applyPrime();
      dlg.close();save();render();
    });
  }
  build();
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
}

/* ---- Events ---- */
let eraseArmed=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="start"){leaveSample();render();location.hash="#home";return;}
  if(act==="add-account"){leaveSample();render();return openForm("account",null,b.dataset.side==="owe"?"card":"chequing");}
  if(act==="add-income"){leaveSample();render();return openForm("income");}
  if(act==="add-bill"){leaveSample();render();return openForm("bill");}
  if(act==="add-goal"){leaveSample();render();return openForm("goal");}
  if(act==="edit-account")return openForm("account",b.dataset.id);
  if(act==="edit-income")return openForm("income",b.dataset.id);
  if(act==="edit-bill")return openForm("bill",b.dataset.id);
  if(act==="edit-goal")return openForm("goal",b.dataset.id);
  if(act==="mdelta"){mDelta=Number(b.dataset.v);render();return;}
  if(act==="guide")return openGuide();
  if(act==="guide-hide"){plan.guideHidden=true;save();render();return;}
  if(act==="guide-skip"){plan.guideSkipInstall=true;save();render();return;}
  if(act==="seg"){flowSeg=b.dataset.v;if(flowSeg==="days"&&!sample&&!plan.guideSeen90){plan.guideSeen90=true;save();}render();return;}
  if(act==="balances"){if(!sample&&plan.accounts.length)openBalances();return;}
  if(act==="go"){const go=b.dataset.go,seg=b.dataset.seg;if(seg==="balances"){if(!sample)openBalances();return;}if($("#dlg").open)$("#dlg").close();if(go==="flow"&&seg)flowSeg=seg;if(go==="flow"&&seg==="days"&&!sample&&!plan.guideSeen90){plan.guideSeen90=true;save();}if(go==="learn"&&seg)lessonId=seg;render();if(go)location.hash="#"+go;window.scrollTo(0,0);return;}
  if(act==="sugg-add"){const s=suggestions().find(x=>x.key===b.dataset.key);if(s)openForm(s.kind,null,{name:s.name,amt:s.amt,freq:s.freq,date:s.next,cat:s.cat||"",_key:s.key});return;}
  if(act==="sugg-skip"){plan.seen=plan.seen||{};plan.seen[b.dataset.key]=1;save();render();return;}
  if(act==="go-check"){flowSeg="check";render();location.hash="#flow";window.scrollTo(0,0);return;}
  if(act==="toggle-all"){showAll=!showAll;render();return;}
  if(act==="ef"){plan.efMonths=Number(b.dataset.v);save();render();return;}
  if(act==="add-saving"){const pi=payInfo();if(!(whatIf>0))return;return openForm("bill",null,{name:"Savings transfer",amt:whatIf,freq:pi.inc?pi.inc.freq:"monthly",date:pi.inc?(L.occurrences(pi.inc,TODAY,L.addDays(TODAY,400))[0]||TODAY):TODAY,cat:"savings"});}
  if(act==="mark"){plan.marks=plan.marks||{};const k=b.dataset.key;if(plan.marks[k]===b.dataset.v)delete plan.marks[k];else plan.marks[k]=b.dataset.v;save();render();return;}
  if(act==="to-bill"){const r=L.analyse(txs).recurring.find(x=>x.key===b.dataset.key);if(r)openForm("bill",null,{name:r.name,amt:Math.round(r.lastAmt*100)/100,freq:"monthly",date:L.addMonths(r.last,1)<TODAY?L.addMonths(r.last,2):L.addMonths(r.last,1),cat:"fun"});return;}
  if(act==="swap-src"){txs.forEach(x=>{if(x.s===b.dataset.src)x.a=-x.a;});save();render();return;}
  if(act==="del-src"){txs=txs.filter(x=>x.s!==b.dataset.src);importNote=null;save();render();return;}
  if(act==="export")return exportBackup();
  if(act==="erase"){if(!eraseArmed){eraseArmed=true;b.textContent="Tap again to erase all your numbers";return;}eraseArmed=false;plan=emptyPlan();txs=[];importNote=null;whatIf=null;save();render();return;}
  if(act==="lesson"){lessonId=b.dataset.id;render();$("#lesson").scrollIntoView({block:"start"});return;}
  if(act==="open-today"){lessonId=null;render();return;}
  if(act==="surprise"){const pool=LESSONS.filter(x=>!learn.done[x.id]&&x.id!==lessonId);const p=pool.length?pool:LESSONS;lessonId=p[Math.floor(Math.random()*p.length)].id;render();return;}
  if(act==="learned"){if(learn.done[b.dataset.id])delete learn.done[b.dataset.id];else learn.done[b.dataset.id]=TODAY;saveLearn();render();return;}
  if(act==="quiz"){const q=b.closest(".quiz"),a=Number(q.dataset.a);q.querySelectorAll("button").forEach((x,i)=>{x.classList.toggle("right",i===a);x.classList.toggle("wrong",x===b&&i!==a);});const w=$("#quiz-why");w.hidden=false;w.textContent=(Number(b.dataset.i)===a?"Correct. ":"Not quite. ")+w.textContent.replace(/^(Correct\. |Not quite\. )/,"");return;}
});
document.addEventListener("input",e=>{
  if(e.target.id==="wi"){whatIf=Number(e.target.value);$("#wi-val").textContent=money(whatIf);const t=L.totals(plan);$("#wi-out").innerHTML=whatIfOut(t,flowCats(t));return;}
  const w=e.target.closest(".widget");
  if(w){const v={};w.querySelectorAll("input").forEach(i=>v[i.dataset.k]=num(i.value));w.querySelector(".out").innerHTML=W[w.dataset.w].calc(v);}
});
document.addEventListener("change",e=>{
  if(e.target.id==="prime"){const v=num(e.target.value);if(v>0&&!sample){plan.prime=v;plan.primeUpdated=TODAY;applyPrime();save();}render();return;}
  if(e.target.id==="m-extra"){mExtra=Math.max(0,num(e.target.value));render();return;}
  if(e.target.id==="sp-month"){spMonth=e.target.value;render();return;}
  if(e.target.classList.contains("set-cat")){plan.catMap=plan.catMap||{};plan.catMap[e.target.dataset.key]=e.target.value;save();render();return;}
  if(e.target.id==="cushion"){plan.cushion=Math.max(0,num(e.target.value));save();render();}
  if(e.target.id==="wi"){const t=L.totals(plan),f=flowCats(t);renderSave(t,null,f);}
});
const TITLES={home:"Home",flow:"Money flow",save:"Save",learn:"Learn",accounts:"Accounts",formulas:"How it is calculated",mortgage:"Your mortgage"};
function route(){
  let h=location.hash.replace("#","");if(!TITLES[h])h="home";
  for(const id in TITLES){$("#v-"+id).hidden=id!==h;const a=document.querySelector(`nav a[data-tab="${id}"]`);if(!a)continue;if(id===h||((h==="formulas"||h==="mortgage")&&id==="accounts"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");}
  $("#page-title").textContent=TITLES[h];
  if(h==="flow")drawFlow();
  if(h==="learn"&&learn.last!==TODAY){touchLearn();render();}
}
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0);});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawFlow,150);});

loadSample();load();render();
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
